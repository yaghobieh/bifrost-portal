<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bifrostBridge" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bifrostCore" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <filter id="bifrostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Bridge Arch -->
  <path
    d="M8 44 C8 24 20 10 32 10 C44 10 56 24 56 44"
    stroke="url(#bifrostBridge)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Mid Bridge Arch -->
  <path
    d="M16 45 C16 32 23 20 32 20 C41 20 48 32 48 45"
    stroke="url(#bifrostBridge)"
    stroke-width="4.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Inner Portal Arch -->
  <path
    d="M23 46 C23 38 27 30 32 30 C37 30 41 38 41 46"
    stroke="url(#bifrostBridge)"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Radiant Nexus / Portal Core Star -->
  <g filter="url(#bifrostGlow)">
    <circle cx="32" cy="46" r="4.5" fill="url(#bifrostBridge)" />
    <circle cx="32" cy="46" r="2.5" fill="url(#bifrostCore)" />
  </g>
  
  <!-- Foundation Pedestals -->
  <circle cx="8" cy="44" r="2.5" fill="#4F46E5" />
  <circle cx="56" cy="44" r="2.5" fill="#06B6D4" />
</svg>
